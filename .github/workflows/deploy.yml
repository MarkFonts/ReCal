name: Deploy to wordmark/recalsans-legacy

on:
  push:
    branches: [recalsans-legacy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Push to MarkFonts/wordmark
        env:
          TOKEN: ${{ secrets.WORDMARK_DEPLOY_TOKEN3 }}
        run: |
          GIT_TERMINAL_PROMPT=0 git clone https://x-access-token:${TOKEN}@github.com/MarkFonts/wordmark.git wordmark-repo
          rm -rf wordmark-repo/recalsans-legacy
          cp -r dist/ wordmark-repo/recalsans-legacy
          cd wordmark-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "deploy: freeze recalsans-legacy"
          git push
