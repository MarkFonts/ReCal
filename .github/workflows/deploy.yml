name: Deploy to wordmark/recalsans

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Push to MarkFonts/wordmark
        env:
          TOKEN: ${{ secrets.WORDMARK_DEPLOY_TOKEN3 }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/MarkFonts/wordmark.git wordmark-repo
          rm -rf wordmark-repo/recalsans
          cp -r dist/ wordmark-repo/recalsans
          cd wordmark-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "deploy: update recalsans"
          git push
