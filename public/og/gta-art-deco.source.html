<!doctype html><html><head><meta charset="utf-8"><style>
/* /gta-art-deco/'s OG card -- the "This isn't X... It's Y" format over a synthwave scene drawn
   here in SVG (striped sun, mountains, cyan grid), carrying the house card's text: the baked font
   first, a tiny FONT SIMILAR TO, the referent huge, then the axes line and the foot. No
   third-party imagery, one typeface, one plain shadow. Rendered by
   scripts/render-og-synthwave.mjs, which swaps in the app's CalSansVF as a data URL. */
@font-face{font-family:Cal;src:url("__CALSANS__") format("truetype");font-weight:400 700}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#1c0a5e}
.scene{position:absolute;inset:0}
/* every line is the baked preset: GEOM 25, SHRP 80, opsz pinned per role, cv22 + ss16 */
.t{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;color:#fff;font-family:Cal,sans-serif;font-optical-sizing:none;
  font-feature-settings:'kern' 1,'cv22' 1,'ss16' 1;text-shadow:0 2px 16px rgba(10,4,40,.7)}
.eyebrow{top:44px;font-size:21px;letter-spacing:.16em;text-transform:uppercase;color:#ffe3f4;
  font-variation-settings:'GEOM' 25,'SHRP' 80,'opsz' 14}
.lead{top:104px;font-size:60px;letter-spacing:-.02em;font-variation-settings:'GEOM' 25,'SHRP' 80,'opsz' 30}
.sim{top:190px;font-size:21px;letter-spacing:.16em;text-transform:uppercase;color:#ffe3f4;font-variation-settings:'GEOM' 25,'SHRP' 80,'opsz' 14}
.word{top:222px;font-size:170px;line-height:1.06;letter-spacing:-.02em;font-weight:625;
  font-variation-settings:'GEOM' 25,'SHRP' 80,'opsz' 18;
  /* the one effect on the card: a neon glow on the referent */
  text-shadow:0 0 14px rgba(255,120,220,.75),0 0 38px rgba(255,60,190,.55),0 0 80px rgba(255,40,170,.35),0 3px 18px rgba(10,4,40,.6)}
.axes{top:492px;font-size:21px;font-variant-numeric:tabular-nums;font-variation-settings:'GEOM' 25,'SHRP' 80,'opsz' 8.1}
.axes .k{color:#cfe9ff}.axes .v{color:#7ff6ff}
.foot{top:544px;font-size:26px;color:#ffe3f4;font-variation-settings:'GEOM' 25,'SHRP' 80,'opsz' 16}
