<!doctype html>
<!-- Source for og/default.png — the ReCal GEOM control, held at the default.
     Re-render (font must load, so allow file access):
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
         --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
         --screenshot=public/og/default.png --allow-file-access-from-files \
         "file://$PWD/public/og/default.source.html"
     Opening this file directly in a browser shows Helvetica: Chrome blocks font loads over
     file:// without that flag. Serve it over http instead to eyeball it. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"Cal";src:url("../fonts/CalSansVF.ttf") format("truetype")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0f0f0f;font-family:"Cal",sans-serif;font-optical-sizing:auto;color:#e8e8e8;
position:relative;-webkit-font-smoothing:antialiased}

/* The UI layer is set larger than the app's own chrome on purpose. This image is scaled
   down by every service that shows it, so sizes that are right in the product are thin
   and broken here. */
.eyebrow{position:absolute;left:72px;top:48px;font-size:21px;letter-spacing:.16em;
text-transform:uppercase;font-variation-settings:"GEOM" 100,"wght" 500;color:rgba(232,232,232,.46)}
.name{position:absolute;right:72px;top:40px;font-size:40px;
font-variation-settings:"GEOM" 50,"wght" 620;letter-spacing:-.02em}
.word{position:absolute;left:72px;right:72px;top:132px;font-size:222px;line-height:1;
text-align:center;letter-spacing:-.015em;
font-variation-settings:"GEOM" 25,"SHRP" 0,"wght" 400}
.chips{position:absolute;left:72px;top:430px;display:flex;gap:12px;align-items:center}
.chip{font-size:27px;padding:9px 21px;border-radius:999px;corner-shape:superellipse(1.2);
font-variation-settings:"GEOM" 25,"wght" 500}
.chip.on{color:#0f0f0f;font-variation-settings:"GEOM" 25,"wght" 640}
.chip.hov{box-shadow:inset 0 0 0 1.6px currentColor}   /* the real --stroke-hover */
.lbl{position:absolute;left:72px;bottom:96px;font-size:27px;
font-variation-settings:"GEOM" 25,"wght" 450;color:rgba(232,232,232,.8)}
.val{position:absolute;right:72px;bottom:96px;font-size:27px;font-variant-numeric:tabular-nums;
font-variation-settings:"GEOM" 25,"wght" 450}
.track{position:absolute;left:72px;right:72px;bottom:62px;height:3px;background:rgba(232,232,232,.2)}
.handle{position:absolute;top:-11px;width:25px;height:25px;margin-left:-12px;left:25%;
background:#e8e8e8;transform:rotate(45deg);border-radius:4px;box-shadow:0 0 0 5px #0f0f0f}
.cur{position:absolute;left:118px;top:452px;z-index:9}
</style></head><body>
<div class="eyebrow">wordmark.nyc &middot; customize a free variable font</div>
<div class="name">ReCal Sans</div>
<div class="word">Magic</div>
<div class="chips"><span class="chip hov" style="color:#e08a63;">A11y</span>
    <span class="chip on" style="background:#ffffff;">UI</span>
    <span class="chip" style="color:#6f9ee8;">Base</span>
    <span class="chip" style="color:#5fc678;">Geo</span>
    </div>
<div class="lbl">Geometric form</div>
<div class="val">GEOM 25</div>
<div class="track"><i class="handle"></i></div>
<svg class="cur" width="30" height="39" viewBox="0 0 26 34">
<path d="M2 2 L2 25 L8.5 19.5 L12.5 28.5 L16.5 26.5 L12.5 18 L21 17.5 Z" fill="#e8e8e8"
stroke="#0f0f0f" stroke-width="1.6" stroke-linejoin="round"/></svg>
</body></html>
